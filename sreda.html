<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>СреDA</title>
<meta name="apple-mobile-web-app-title" content="СреDA">
<meta name="application-name" content="СреDA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#6C4CF5">
<link rel="manifest" href="sreda.webmanifest">
<link rel="icon" type="image/png" href="sreda-icon-192.png">
<link rel="apple-touch-icon" href="sreda-icon-192.png">
<style>
:root{--bg:#f3f1fa;--card:#fff;--ink:#1f1a2e;--mut:#7a7390;--acc:#6c4cf5;--ok:#22b45a;--bad:#ef4444;--line:#e7e3f3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding:0 14px 90px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 8px}
.role{display:flex;background:#e4def8;border-radius:12px;padding:3px}
.role button{flex:1;border:0;background:none;padding:8px;border-radius:10px;font:inherit;font-weight:700;color:var(--mut)}
.role button.on{background:#fff;color:var(--acc);box-shadow:0 1px 4px #0001}
.top{display:flex;align-items:center;gap:8px;margin-top:10px}
.top h1{font-size:20px;margin:0;flex:1}
.top h1 small{display:block;font-size:12px;color:var(--mut);font-weight:600;letter-spacing:.5px}
.pill{background:#fff;border-radius:20px;padding:5px 10px;font-weight:700;font-size:14px;box-shadow:0 1px 3px #0001;white-space:nowrap}
.card{background:var(--card);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #2a1f5510}
.card h2{margin:0 0 10px;font-size:17px}
.card h2 small{color:var(--mut);font-weight:400;font-size:13px}
/* персонаж */
.sim{text-align:center;padding:18px 16px 12px}
.plumbob{width:24px;height:36px;margin:0 auto 6px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotateY(180deg)}}
.face{font-size:72px;line-height:1}
.mood{color:var(--mut);margin-top:2px}
.simname{border:0;background:none;font:inherit;font-size:20px;font-weight:800;color:var(--ink);margin-top:6px;padding:4px 8px;border-radius:10px}
.simname span{font-size:14px;opacity:.6}
/* пирамида */
.pyr{display:flex;flex-direction:column;align-items:center;gap:5px;margin:6px 0 2px}
.star{font-size:34px;filter:grayscale(1);opacity:.3;transition:.6s}
.star.on{filter:none;opacity:1;animation:glow 2s ease-in-out infinite}
@keyframes glow{50%{transform:scale(1.15)}}
.fl{height:52px;display:flex;align-items:center;justify-content:center;gap:6px;color:#fff;font-weight:800;font-size:14px;clip-path:polygon(7% 0,93% 0,100% 100%,0 100%);transition:.6s;text-shadow:0 1px 2px #0003;cursor:pointer}
.fl.off{filter:grayscale(1);opacity:.35}
.fl span{font-weight:600;font-size:12px;opacity:.95}
.hint{font-size:12px;color:var(--mut);text-align:center;margin-top:6px}
/* шкалы */
.need{display:grid;grid-template-columns:26px 104px 1fr 42px;align-items:center;gap:8px;margin:9px 0}
.need .e{font-size:20px}
.bar{height:12px;background:#eee9f8;border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;transition:width .6s,background .6s}
.need b{font-size:13px;text-align:right}
.dots{font-size:15px;letter-spacing:1px}
.ftitle{font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;margin:14px 0 2px}
.ftitle:first-of-type{margin-top:0}
/* задания */
.task{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.task .t{flex:1}
.task small{display:block;color:var(--mut)}
.btn{border:0;border-radius:12px;padding:9px 13px;font:inherit;font-weight:700;background:var(--acc);color:#fff;white-space:nowrap}
.btn.g{background:var(--ok)}.btn.r{background:#fde8e8;color:var(--bad)}.btn.s{background:#eee9f8;color:var(--acc)}
.btn:disabled{opacity:.45}
.st{font-size:13px;font-weight:700;padding:6px 10px;border-radius:10px;white-space:nowrap}
.st.p{background:#fff4dc;color:#b7791f}.st.d{background:#e3f7ea;color:var(--ok)}
.ret{color:var(--bad);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rw{background:#faf8ff;border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}
.rw .e{font-size:38px}.rw .n{font-weight:700;margin:4px 0}.rw .p{color:var(--acc);font-weight:800;margin-bottom:8px}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.bd{font-size:11px;color:var(--mut)}.bd div{font-size:30px}
.bd.off div{filter:grayscale(1);opacity:.25}
.tg{background:#fff;border-radius:16px;overflow:hidden;margin:10px 0;border:1px solid var(--line)}
.tg .h{background:#2aabee;color:#fff;font-size:13px;padding:6px 12px;font-weight:700}
.tg .b{padding:12px}
.tg .k{display:flex;gap:8px;margin-top:10px}.tg .k .btn{flex:1}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav .in{display:flex;max-width:480px;width:100%}
nav button{flex:1;border:0;background:none;padding:10px 4px 12px;font:inherit;font-size:12px;color:var(--mut)}
nav button span{display:block;font-size:22px}
nav button.on{color:var(--acc);font-weight:700}
.empty{color:var(--mut);text-align:center;padding:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
input,select{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:10px;min-width:0;flex:1}
.demo{background:#1f1a2e;color:#fff}.demo p{color:#c9c3dc;margin:4px 0 10px;font-size:13px}
.log{font-size:13px;color:var(--mut);margin:4px 0}
.heart{display:flex;align-items:center;gap:12px}.heart .e{font-size:40px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#1f1a2e;color:#fff;padding:10px 16px;border-radius:14px;opacity:0;transition:.3s;pointer-events:none;max-width:90%;text-align:center;z-index:9}
.toast.on{opacity:1;transform:translateX(-50%)}
.pop{animation:pop .5s}@keyframes pop{40%{transform:scale(1.25)}}
.bigs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{border:0;border-radius:16px;padding:18px 10px;font:inherit;font-size:16px;font-weight:800;background:linear-gradient(135deg,#4cc72a,#22a06b);color:#fff;text-align:center;box-shadow:0 4px 12px #22a06b40}
.big.ok{background:#e3f7ea;color:var(--ok);box-shadow:none;font-size:14px}
.chk{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ci{border:1px solid var(--line);background:#faf8ff;border-radius:10px;padding:6px 9px;font:inherit;font-size:13px;color:var(--ink)}
.ci.on{background:#e3f7ea;border-color:#bfe9cc;color:var(--ok);font-weight:700}
.tgl{border:0;border-radius:10px;padding:7px 10px;font:inherit;font-size:12px;font-weight:700;background:#eee;color:var(--mut);white-space:nowrap}
.tgl.on{background:#e3f7ea;color:var(--ok)}
.q{font-size:11px;font-weight:800;color:#b7791f;background:#fff4dc;border-radius:6px;padding:1px 6px}
.card.ask{border:2px solid #f5c66a}
.simfig{border:0;background:none;padding:0;display:block;margin:0 auto;cursor:pointer}
.simfig svg{display:block;margin:0 auto}
.simfig.jump svg{animation:jump .9s ease 2}@keyframes jump{30%{transform:translateY(-18px) scale(1.04,.97)}55%{transform:translateY(0) scale(1.03,.96)}75%{transform:translateY(-6px)}}
.sw{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.dot{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.dot.on{box-shadow:0 0 0 3px var(--acc)}
.opt{border:1px solid var(--line);background:#faf8ff;border-radius:12px;padding:8px 12px;font:inherit;font-weight:700;color:var(--ink)}
.opt.on{background:var(--acc);color:#fff;border-color:var(--acc)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="role"><button data-role="kid">👧 Яна</button><button data-role="parent">👨‍👩‍👧 Родитель</button></div>
    <div class="top"><h1 id="title"></h1><span class="pill" id="lvl"></span><span class="pill" id="pts"></span></div>
  </header>
  <main id="main"></main>
</div>
<nav><div class="in" id="nav"></div></nav>
<div class="toast" id="toast"></div>
<script>
// ===== Сим 2.0, стиль B+ (объём, блики, аксессуары, моргание): SVG по слоям + лицо по настроению =====
var LOOK_DEF = {skin:'#F6D3B3', hair:'bob', hairC:'#6B3E26', top:'#FFB547', bottom:'pants', bottomC:'#3D7BF5', shoes:'#ffffff', hat:'none', glasses:'no', bag:'no'};
var LOOK_OPTS = {
  skin:   {n:'Кожа', c:['#FBE0CC','#F6D3B3','#E8B48C','#C68A5E','#8D5A3B']},
  hair:   {n:'Причёска', o:[['bob','Каре'],['long','Длинные'],['pony','Хвостик'],['bun','Пучок']]},
  hairC:  {n:'Цвет волос', c:['#2B1B12','#6B3E26','#A0522D','#E8C07A','#E0603B','#FF7AB6','#8B6CF6']},
  top:    {n:'Верх', c:['#FFB547','#FF7AB6','#8B6CF6','#3D7BF5','#3DDC6B','#EF4444','#ffffff','#1F1A2E']},
  bottom: {n:'Низ', o:[['pants','Брюки'],['skirt','Юбка'],['shorts','Шорты']]},
  bottomC:{n:'Цвет низа', c:['#3D7BF5','#1F1A2E','#8B6CF6','#FF7AB6','#3DDC6B','#E8C07A','#ffffff']},
  shoes:  {n:'Обувь', c:['#ffffff','#FF7AB6','#1F1A2E','#8B6CF6','#EF4444']},
  hat:    {n:'На голове', o:[['none','Ничего'],['bow','Бантик'],['cap','Кепка'],['crown','Корона']]},
  glasses:{n:'Очки', o:[['no','Нет'],['yes','Да']]},
  bag:    {n:'Рюкзак', o:[['no','Нет'],['yes','Да']]}
};
function shade(hex, k){ // затемнить цвет (k<1) для теней и обводок
  var n = parseInt(hex.slice(1), 16), r = (n >> 16) * k, g = (n >> 8 & 255) * k, b = (n & 255) * k;
  return '#' + [r, g, b].map(function(x){ return ('0' + Math.round(x).toString(16)).slice(-2); }).join('');
}
function starPath(cx, cy, r){
  var p = '';
  for (var i = 0; i < 10; i++){ var a = Math.PI / 5 * i - Math.PI / 2, rr = i % 2 ? r * .45 : r; p += (i ? 'L' : 'M') + (cx + rr * Math.cos(a)).toFixed(1) + ',' + (cy + rr * Math.sin(a)).toFixed(1); }
  return p + 'Z';
}
// mood: all | great | good | meh | sad | bad;  anim=true — моргает и «дышит»
function simSVG(L, mood, size, anim){
  L = L || LOOK_DEF; var k = L.skin, hc = L.hairC, ink = '#2B1B3D', h = '';
  var ol = function(c){ return ' stroke="'+(c.toLowerCase() === '#ffffff' ? '#d9d4e6' : shade(c, .78))+'" stroke-width="3"'; };
  var dark = function(d){ return '<path d="'+d+'" fill="#000" opacity=".09"/>'; };
  var shine = function(d){ return '<path d="'+d+'" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".35"/>'; };
  // тень на полу
  h += '<ellipse cx="210" cy="521" rx="78" ry="8" fill="#000" opacity=".10"/>';
  // рюкзак (сзади)
  if (L.bag === 'yes') h += '<rect x="158" y="268" width="104" height="120" rx="26" fill="#8B6CF6"'+ol('#8B6CF6')+'/>';
  // волосы сзади
  if (L.hair === 'bob')  h += '<path d="M135,200 Q135,118 210,118 Q285,118 285,200 L285,268 L135,268 Z" fill="'+hc+'"'+ol(hc)+'/>';
  if (L.hair === 'long') h += '<path d="M135,200 Q135,118 210,118 Q285,118 285,200 L294,345 Q210,362 126,345 Z" fill="'+hc+'"'+ol(hc)+'/>';
  if (L.hair === 'pony' || L.hair === 'bun') h += '<path d="M148,195 Q146,126 210,126 Q274,126 272,195 Z" fill="'+hc+'"'+ol(hc)+'/>';
  if (L.hair === 'pony') h += '<path d="M268,160 Q330,170 318,260 Q312,300 290,318 Q300,260 262,200 Z" fill="'+hc+'"'+ol(hc)+'/>'+shine('M300,190 Q312,215 308,245')+'<circle cx="272" cy="172" r="12" fill="#FF7AB6"'+ol('#FF7AB6')+'/>';
  if (L.hair === 'bun')  h += '<circle cx="210" cy="126" r="34" fill="'+hc+'"'+ol(hc)+'/>'+shine('M192,108 Q200,98 214,98')+'<rect x="190" y="152" width="40" height="10" rx="5" fill="#FF7AB6"/>';
  // тело (с «дыханием»)
  var b = '';
  b += '<rect x="194" y="258" width="32" height="30" fill="'+k+'"/><ellipse cx="210" cy="266" rx="18" ry="7" fill="'+shade(k, .82)+'"/>';
  b += '<rect x="118" y="300" width="28" height="110" rx="14" fill="'+k+'"'+ol(k)+'/><rect x="274" y="300" width="28" height="110" rx="14" fill="'+k+'"'+ol(k)+'/>';
  b += dark('M290,304 Q300,310 300,330 L300,396 Q300,408 288,408 Z');
  var bc = L.bottomC;
  if (L.bottom === 'pants'){
    b += '<rect x="168" y="420" width="30" height="86" rx="10" fill="'+bc+'"'+ol(bc)+'/><rect x="222" y="420" width="30" height="86" rx="10" fill="'+bc+'"'+ol(bc)+'/>' + dark('M240,424 L250,424 L250,500 L240,500 Z');
  } else {
    var legTop = L.bottom === 'skirt' ? 440 : 430;
    b += '<rect x="172" y="'+legTop+'" width="24" height="'+(506-legTop)+'" rx="10" fill="'+k+'"'+ol(k)+'/><rect x="224" y="'+legTop+'" width="24" height="'+(506-legTop)+'" rx="10" fill="'+k+'"'+ol(k)+'/>';
    if (L.bottom === 'shorts') b += '<rect x="166" y="420" width="34" height="34" rx="10" fill="'+bc+'"'+ol(bc)+'/><rect x="220" y="420" width="34" height="34" rx="10" fill="'+bc+'"'+ol(bc)+'/>';
  }
  if (L.bottom !== 'skirt') b += '<rect x="150" y="380" width="120" height="56" fill="'+bc+'"/><rect x="150" y="410" width="120" height="40" rx="20" fill="'+bc+'"'+ol(bc)+'/>' + dark('M240,384 L270,384 L270,432 Q268,448 250,450 L240,450 Z');
  b += '<rect x="150" y="286" width="120" height="'+(L.bottom === 'skirt' ? 110 : 120)+'" rx="40" fill="'+L.top+'"'+ol(L.top)+'/>';
  b += dark('M236,290 Q266,292 268,326 L268,'+(L.bottom === 'skirt' ? 380 : 390)+' Q266,'+(L.bottom === 'skirt' ? 394 : 404)+' 236,'+(L.bottom === 'skirt' ? 394 : 404)+' Z');
  b += '<path d="M190,288 Q210,304 230,288" fill="none" stroke="'+shade(L.top, .78)+'" stroke-width="4" stroke-linecap="round"/>';
  b += '<path d="M210,350 l5,10 11,1 -8,7 2,11 -10,-6 -10,6 2,-11 -8,-7 11,-1 Z" fill="#fff" opacity=".75"/>';
  if (L.bottom === 'skirt') b += '<path d="M152,380 L268,380 L292,452 Q210,466 128,452 Z" fill="'+bc+'"'+ol(bc)+'/>' + dark('M238,380 L268,380 L292,452 Q270,457 250,459 Z');
  if (L.bag === 'yes') b += '<rect x="164" y="288" width="12" height="74" rx="6" fill="#6C4CF5"/><rect x="244" y="288" width="12" height="74" rx="6" fill="#6C4CF5"/>';
  b += '<rect x="160" y="500" width="46" height="20" rx="10" fill="'+L.shoes+'"'+ol(L.shoes)+'/><rect x="214" y="500" width="46" height="20" rx="10" fill="'+L.shoes+'"'+ol(L.shoes)+'/>';
  b += '<path d="M164,514 L202,514 M218,514 L256,514" stroke="'+shade(L.shoes, .7)+'" stroke-width="3" stroke-linecap="round" opacity=".6"/>';
  h += anim ? '<g><animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="3.2s" repeatCount="indefinite"/>'+b+'</g>' : b;
  // голова
  var g = '<circle cx="210" cy="205" r="62" fill="'+k+'"'+ol(k)+'/>';
  g += dark('M250,160 Q272,185 270,212 Q266,250 232,264 Q262,238 258,200 Q256,178 250,160 Z');
  g += '<path d="M148,195 Q150,140 210,138 Q270,140 272,195 L272,175 Q240,170 222,148 Q200,172 148,180 Z" fill="'+hc+'"'+ol(hc)+'/>';
  g += shine('M168,160 Q180,146 198,144');
  // лицо
  var cheeks = '<ellipse cx="170" cy="230" rx="10" ry="7" fill="#FF7AB6" opacity=".4"/><ellipse cx="250" cy="230" rx="10" ry="7" fill="#FF7AB6" opacity=".4"/>';
  var blink = anim ? '<animate attributeName="ry" values="9;9;1;9" keyTimes="0;.93;.96;1" dur="4.5s" repeatCount="indefinite"/>' : '';
  var dots = '<ellipse cx="188" cy="210" rx="8" ry="9" fill="'+ink+'">'+blink+'</ellipse><ellipse cx="232" cy="210" rx="8" ry="9" fill="'+ink+'">'+blink+'</ellipse>'
    + '<circle cx="191" cy="206" r="2.8" fill="#fff"/><circle cx="235" cy="206" r="2.8" fill="#fff"/>'
;
  var arcs = '<path d="M180,213 Q188,202 196,213 M224,213 Q232,202 240,213" fill="none" stroke="'+ink+'" stroke-width="5" stroke-linecap="round"/>';
  var open = '<path d="M197,233 Q210,254 223,233 Z" fill="#8B2E3B" stroke="#8B2E3B" stroke-width="3" stroke-linejoin="round"/><path d="M203,240 Q210,247 217,240" fill="#FF8FA3"/>';
  var line = function(d){ return '<path d="'+d+'" fill="none" stroke="'+ink+'" stroke-width="5" stroke-linecap="round"/>'; };
  if (mood === 'all') g += '<path d="'+starPath(188,210,13)+starPath(232,210,13)+'" fill="#FFC21A" stroke="#E0A000" stroke-width="2"/>' + open + cheeks
    + '<path d="'+starPath(150,150,7)+starPath(276,160,6)+starPath(262,120,5)+'" fill="#FFC21A"/>';
  else if (mood === 'great') g += arcs + open + cheeks;
  else if (mood === 'good') g += dots + line('M198,236 Q210,246 222,236') + cheeks;
  else if (mood === 'meh') g += dots + line('M200,240 L220,240');
  else if (mood === 'sad') g += dots + line('M198,245 Q210,235 222,245') + line('M178,196 L194,200 M242,196 L226,200');
  else g += dots + line('M198,247 Q210,235 222,247') + '<path d="M244,222 Q251,236 244,241 Q237,236 244,222 Z" fill="#5BC0F8"/>';
  // аксессуары
  if (L.glasses === 'yes') g += '<g fill="#fff" fill-opacity=".18" stroke="'+ink+'" stroke-width="4"><circle cx="188" cy="210" r="17"/><circle cx="232" cy="210" r="17"/></g><path d="M205,208 Q210,204 215,208" fill="none" stroke="'+ink+'" stroke-width="4"/>';
  if (L.hat === 'bow') g += '<path d="M252,140 L232,124 L234,156 Z M252,140 L272,124 L270,156 Z" fill="#FF4D8D"'+ol('#FF4D8D')+' stroke-linejoin="round"/><circle cx="252" cy="140" r="8" fill="#FF7AB6"'+ol('#FF4D8D')+'/>';
  if (L.hat === 'cap') g += '<path d="M142,176 Q140,112 210,110 Q280,112 278,176 Q210,164 142,176 Z" fill="#EF4444"'+ol('#EF4444')+'/><path d="M262,170 Q306,168 318,182 Q290,190 262,184 Z" fill="#C81E1E"/><circle cx="210" cy="112" r="6" fill="#C81E1E"/>' + shine('M166,140 Q182,124 204,122');
  if (L.hat === 'crown') g += '<path d="M176,148 L170,108 L192,128 L210,100 L228,128 L250,108 L244,148 Z" fill="#FFC21A" stroke="#E0A000" stroke-width="3" stroke-linejoin="round"/><circle cx="210" cy="128" r="5" fill="#EF4444"/><circle cx="188" cy="136" r="4" fill="#3D7BF5"/><circle cx="232" cy="136" r="4" fill="#3DDC6B"/>';
  h += anim ? '<g><animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="3.2s" repeatCount="indefinite"/>'+g+'</g>' : g;
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 86 220 444" width="'+(size || 130)+'" height="'+Math.round((size || 130) * 444 / 220)+'">' + h + '</svg>';
}

// ===== СреDA · Яна, v3: реальные дела, частоты, чек-листы, кнопки безопасности, поручения =====
// Пирамида для 6–9 лет: 4 этажа (по Маслоу, упрощённо)
var FLOORS = [
  {id:1, e:'💪', n:'Тело',                 c:'#19b6e0'},
  {id:2, e:'🛡️', n:'Порядок и безопасность', c:'#4cc72a'},
  {id:3, e:'❤️', n:'Семья',                c:'#f2b705'},
  {id:4, e:'⭐', n:'Я расту',               c:'#ff7a1a'}
];
// rate = % в час (ночью 21:00–07:00 пауза); weekend = пауза в сб/вс; grow = не убывает, копится
var NEEDS = [

function fresh(){
  var now = clock();
  var s = {kid:'Яна', sim:'', look:JSON.parse(JSON.stringify(LOOK_DEF)), points:0, total:0, heart:0, art:0, reads:0, safeDays:0, fullPyr:false, offset:0, streakDays:[], needs:{}, tasks:[], done:{}, pending:{}, notes:{}, checks:{}, buys:[], rewards:[], log:[]};
  NEEDS.forEach(function(n){ s.needs[n.id] = {v:n.grow ? 0 : 50, t:now}; });
  DEF_TASKS.forEach(function(t){ var c = JSON.parse(JSON.stringify(t)); c.on = !!t.on; s.tasks.push(c); });
  DEF_REWARDS.forEach(function(r,i){ s.rewards.push({id:'r'+i, e:r[0], title:r[1], price:r[2]}); });
  return s;
}
var S;
function load(){ try{ var x = localStorage.getItem(KEY); if (x) return JSON.parse(x); }catch(e){} return null; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function clock(){ return Date.now() + (S ? S.offset : 0); }
function dayKey(t){ var d = new Date(t); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function midnight(t){ var d = new Date(t); d.setHours(0,0,0,0); return d.getTime(); }
function weekStart(t){ var d = new Date(midnight(t)); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d.getTime(); }
function meta(id){ return NEEDS.filter(function(x){ return x.id === id; })[0]; }
function task(id){ return S.tasks.filter(function(x){ return x.id === id; })[0]; }

// Шкала не тикает: храним значение и время, текущее считаем при открытии
function awakeHours(t0, t1, weekend){
  var h = 0, step = 15*60000, t = t0;
  t1 = Math.min(t1, t0 + 7*24*3600000);
  while (t < t1){ var d = Math.min(step, t1 - t), dt = new Date(t), hr = dt.getHours(), wd = dt.getDay();
    if (hr >= 7 && hr < 21 && !(weekend && (wd === 0 || wd === 6))) h += d/3600000; t += d; }
  return h;
}
function needVal(id){
  var n = S.needs[id], m = meta(id);
  if (m.grow) return n.v;
  return Math.max(0, Math.min(100, n.v - m.rate * awakeHours(n.t, clock(), m.weekend)));
}
function addNeed(id, g){ S.needs[id] = {v:Math.min(100, needVal(id) + g), t:clock()}; }
function color(v){ return v > 60 ? '#22b45a' : v > 30 ? '#f5a524' : '#ef4444'; }
// шкала в игре, если у неё есть включённое регулярное дело (поручения шкалу не включают)
function needOn(id){ return S.tasks.some(function(t){ return t.need === id && t.on && t.freq !== 'request'; }); }
function floorNeeds(f){ return NEEDS.filter(function(n){ return n.f === f && needOn(n.id); }); }
function floorOpen(f){ return floorNeeds(f).some(function(n){ return !n.grow; }); }
function floorOn(f){ return floorOpen(f) && floorNeeds(f).filter(function(n){ return !n.grow; }).every(function(n){ return needVal(n.id) >= 60; }); }

// ===== расписание дел =====
function doneList(t){ return S.done[t.id] || []; }
function countToday(t){ var k = dayKey(clock()); return doneList(t).filter(function(x){ return dayKey(x) === k; }).length; }
function scheduledToday(t){
  var wd = new Date(clock()).getDay();
  if (t.freq === 'school') return wd >= 1 && wd <= 5;
  if (t.freq === 'days') return t.days.indexOf(wd) >= 0;
  if (t.freq === 'request') return !!t.requested;
  return true;
}
function limit(t){ return t.freq === 'multi' ? t.max : t.freq === 'free' ? 3 : 1; }
// состояние дела на сегодня: hide | open | pending | done (+ text)
function stateOf(t){
  if (!t.on || !scheduledToday(t)) return {s:'hide'};
  if (S.pending[t.id]) return {s:'pending'};
  var c = countToday(t), L = limit(t), last = doneList(t).slice(-1)[0];
  if (t.freq === 'weekly' && last && last >= weekStart(clock())) return {s:'done', text:'✓ на этой неделе'};
  if (t.freq === 'every' && last && c === 0){
    var ago = Math.round((midnight(clock()) - midnight(last)) / 864e5);
    if (ago < t.every) return {s:'done', text:'✓ снова через '+(t.every - ago)+' дн.'};
  }
  if (c >= L) return {s:'done', text: L > 1 ? '✓ '+c+'/'+L : '✓'};
  return {s:'open', text: L > 1 && t.freq === 'multi' ? c+'/'+L : ''};
}
function freqText(t){
  return t.freq === 'daily' ? 'каждый день' : t.freq === 'school' ? 'по будням' : t.freq === 'days' ? t.days.map(function(d){ return DAYN[d]; }).join(', ')
    : t.freq === 'multi' ? 'до '+t.max+' раз в день' : t.freq === 'weekly' ? 'раз в неделю' : t.freq === 'every' ? 'раз в '+t.every+' дня'
    : t.freq === 'request' ? 'по просьбе' : 'по желанию';
}
function reward(t){
  if (t.pts) return '+'+t.pts+' 🪙' + (t.gain ? ' · +'+t.gain+'%' : '');
  if (t.need === 'art') return '🎨 в копилку творчества';
  if (t.id === 'read') return '📖 к значку «Книголюб» · +'+t.gain+'%';
  return '❤️ в сердце семьи · +'+t.gain+'%';
}

function streak(){
  var c = 0, t = clock();
  if (S.streakDays.indexOf(dayKey(t)) < 0) t -= 86400000;
  while (S.streakDays.indexOf(dayKey(t)) >= 0){ c++; t -= 86400000; }
  return c;
}
function level(){ return Math.floor(S.total / 100) + 1; }
function time(){ var d = new Date(clock()); return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
function log(s){ S.log.unshift(time()+' '+s); S.log = S.log.slice(0, 40); }
function toast(s){ var el = document.getElementById('toast'); el.textContent = s; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(function(){ el.classList.remove('on'); }, 2600); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

// засчитать дело (после подтверждения родителя или сразу для auto)
function confirmTask(t){
  delete S.pending[t.id]; delete S.notes[t.id];
  (S.done[t.id] = S.done[t.id] || []).push(clock()); S.done[t.id] = S.done[t.id].slice(-40);
  var msg;
  if (t.need === 'art'){ S.art++; S.needs.art.v = S.art; msg = '🎨 Творчество в копилке!'; }
  else {
    addNeed(t.need, t.gain);
    if (t.pts){ S.points += t.pts; S.total += t.pts; msg = '+'+t.pts+' 🪙 '+S.kid+' получает баллы!'; pop(); }
    else if (t.id === 'read'){ S.reads++; msg = '📖 +1 к «Книголюбу»'; }
    else { S.heart++; msg = '❤️ +1 в сердце семьи'; }
  }
  if (t.id === 'out' && countToday(task('in')) > 0) S.safeDays++;
  if (t.freq === 'request') t.requested = false;
  if (t.oneoff) S.tasks = S.tasks.filter(function(x){ return x !== t; });
  if (S.streakDays.indexOf(dayKey(clock())) < 0) S.streakDays.push(dayKey(clock()));
  return msg;
}

var role = 'kid', tab = {kid:'sim', parent:'check'};
var TABS = {kid:[['sim','🔺','Моя СреDA'],['tasks','✅','Дела'],['shop','🎁','Магазин']], parent:[['check','🔔','Проверка'],['setup','⚙️','Настройки']]};

function render(){
  document.querySelectorAll('.role button').forEach(function(b){ b.classList.toggle('on', b.dataset.role === role); });
  document.querySelector('.role button').textContent = '👧 ' + S.kid;
  var pend = Object.keys(S.pending).length + S.buys.filter(function(b){return b.status==='pending';}).length;
  document.getElementById('title').innerHTML = '<small>СРЕDA</small>' + (role === 'kid' ? 'Привет, ' + esc(S.kid) + '!' : 'Кабинет родителя');
  document.getElementById('lvl').textContent = '⭐ ' + level();
  document.getElementById('pts').textContent = '🪙 ' + S.points;
  document.getElementById('nav').innerHTML = TABS[role].map(function(t){
    var badge = (t[0]==='check' && pend) ? ' ('+pend+')' : '';
    return '<button data-tab="'+t[0]+'" class="'+(tab[role]===t[0]?'on':'')+'"><span>'+t[1]+'</span>'+t[2]+badge+'</button>';
  }).join('');
  document.getElementById('main').innerHTML = VIEWS[tab[role]]();
  if (role === 'kid' && tab.kid === 'sim' && S.total !== S.seenTotal){ S.seenTotal = S.total; save(); }
}

function safeButtons(){
  var a = task('in'), b = task('out'), h = '';
  [a, b].forEach(function(t){
    var st = stateOf(t); if (st.s === 'hide') return;
    var last = doneList(t).slice(-1)[0];
    h += st.s === 'open' ? '<button class="big" data-done="'+t.id+'">'+esc(t.title)+'</button>'
      : '<div class="big ok">✓ '+esc(t.title)+' · '+new Date(last).toTimeString().slice(0,5)+'</div>';
  });
  return h ? '<div class="card"><h2>🛡️ Школа <small>родители сразу получат уведомление</small></h2><div class="bigs">'+h+'</div></div>' : '';
}

function taskRow(t){
  var st = stateOf(t);
  if (st.s === 'hide' || t.auto) return '';
  var ch = '', ready = true;
  if (t.check && st.s === 'open'){
    var c = S.checks[t.id]; if (!c || c.day !== dayKey(clock())) c = S.checks[t.id] = {day:dayKey(clock()), v:t.check.map(function(){ return false; })};
    ch = '<div class="chk">' + t.check.map(function(x, i){ return '<button class="ci '+(c.v[i]?'on':'')+'" data-ci="'+t.id+':'+i+'">'+(c.v[i]?'☑':'☐')+' '+esc(x)+'</button>'; }).join('') + '</div>';
    ready = c.v.every(Boolean);
  }
  var right = st.s === 'open' ? '<button class="btn" data-done="'+t.id+'" '+(ready?'':'disabled')+'>Сделано'+(st.text?' '+st.text:'')+'</button>'
    : st.s === 'pending' ? '<span class="st p">⏳ ждёт</span>' : '<span class="st d">'+(st.text||'✓')+'</span>';
  var note = S.notes[t.id] && st.s === 'open' ? '<div class="ret">↩ Вернули: '+esc(S.notes[t.id])+'</div>' : '';
  var tag = t.oneoff || t.freq === 'request' ? '<span class="q">⚡ просьба</span> ' : '';
  return '<div class="task"><div class="t">'+tag+esc(t.title)+'<small>'+reward(t)+'</small>'+note+ch+'</div>'+right+'</div>';
}

var VIEWS = {
  sim: function(){
    var bars = NEEDS.filter(function(n){ return !n.grow && needOn(n.id); });
    var vals = bars.map(function(n){ return needVal(n.id); });
    var avg = vals.length ? vals.reduce(function(a,b){return a+b;}, 0) / vals.length : 50;
    var open = FLOORS.map(function(f){ return floorOpen(f.id); });
    var on = FLOORS.map(function(f){ return floorOn(f.id); });
    var all = open.some(Boolean) && FLOORS.every(function(f, i){ return !open[i] || on[i]; });
    if (all && !S.fullPyr){ S.fullPyr = true; save(); setTimeout(function(){ toast('🔺 Вся пирамида горит! Новый значок!'); }, 300); }
    var mk = all ? 'all' : avg > 70 ? 'great' : avg > 55 ? 'good' : avg > 40 ? 'meh' : avg > 20 ? 'sad' : 'bad';
    var mood = all ? 'Идеальный баланс!' : avg > 70 ? 'Отличное настроение!' : avg > 55 ? 'Всё хорошо' : avg > 40 ? 'Так себе…' : avg > 20 ? 'Нужна забота' : 'Срочно помоги себе!';
    var h = '<div class="card sim"><div class="plumbob" style="background:'+color(avg)+'"></div><button class="simfig'+(S.total > (S.seenTotal || 0) ? ' jump' : '')+'" data-act="look">'+simSVG(S.look, mk, 130, true)+'</button>'
      + '<button class="simname" data-act="simname">'+(S.sim ? esc(S.sim)+' <span>✏️</span>' : 'Дай мне имя ✏️')+'</button><div class="mood">'+mood+'</div><button class="btn s" data-act="look" style="margin-top:8px">✨ Переодеть</button>';
    h += '<div class="pyr"><div class="star '+(all?'on':'')+'">🌟</div>';
    for (var i = FLOORS.length - 1; i >= 0; i--){
      var f = FLOORS[i], w = [100, 84, 68, 52][i];
      h += '<div class="fl '+(on[i]?'':'off')+'" data-floor="'+f.id+'" style="width:'+w+'%;background:'+f.c+'">'+(open[i] ? f.e+' '+f.n : '🔒 скоро')+'</div>';
    }
    h += '</div><div class="hint">Этаж загорается, когда все его шкалы выше 60%. Зажги все, и вспыхнет звезда!</div></div>';
    h += safeButtons();
    h += '<div class="card"><h2>Потребности</h2>';
    FLOORS.forEach(function(f){
      var ns = floorNeeds(f.id); if (!ns.length) return;
      h += '<div class="ftitle" style="color:'+f.c+'">'+f.e+' '+f.n+'</div>';
      ns.forEach(function(n){
        if (n.grow){ var c = S.art; h += '<div class="need"><span class="e">'+n.e+'</span><span>'+n.n+'</span><span class="dots">'+(c ? '🎨'.repeat(Math.min(c,8)) + (c > 8 ? ' ×'+c : '') : '<small style="color:var(--mut)">пока пусто</small>')+'</span><b></b></div>'; return; }
        var v = Math.round(needVal(n.id));
        h += '<div class="need"><span class="e">'+n.e+'</span><span>'+n.n+'</span><div class="bar"><i style="width:'+v+'%;background:'+color(v)+'"></i></div><b>'+v+'%</b></div>';
      });
    });
    h += '</div><div class="card heart"><div class="e">❤️</div><div><b>Сердце семьи: '+S.heart+'</b><div class="log">Общие моменты без баллов: звонки бабушке, игры, ужины вместе.</div></div></div>';
    h += '<div class="card"><h2>Значки <small>'+BADGES.filter(function(b){return b[2]();}).length+' из '+BADGES.length+'</small></h2><div class="badges">'
      + BADGES.map(function(b){ return '<div class="bd '+(b[2]()?'':'off')+'"><div>'+b[0]+'</div>'+b[1]+'</div>'; }).join('') + '</div>'
      + '<div class="row" style="margin-top:12px"><span class="pill">🔥 Серия: '+streak()+' дн.</span><span class="pill">📈 До ур. '+(level()+1)+': '+(100 - S.total % 100)+' 🪙</span></div></div>';
    return h;
  },
  tasks: function(){
    var h = safeButtons();
    var asks = S.tasks.filter(function(t){ return (t.freq === 'request' || t.oneoff) && stateOf(t).s !== 'hide'; });
    if (asks.length) h += '<div class="card ask"><h2>⚡ Просьбы родителей</h2>' + asks.map(taskRow).join('') + '</div>';
    FLOORS.forEach(function(f){
      var rows = '';
      NEEDS.filter(function(n){ return n.f === f.id; }).forEach(function(n){
        var list = S.tasks.filter(function(t){ return t.need === n.id && t.freq !== 'request' && !t.oneoff; }).map(taskRow).join('');
        if (list) rows += '<div class="ftitle" style="color:var(--mut)">'+n.e+' '+n.n+(n.grow ? '' : ' · '+Math.round(needVal(n.id))+'%')+'</div>' + list;
      });
      if (rows) h += '<div class="card"><h2 style="color:'+f.c+'">'+f.e+' '+f.n+'</h2>'+rows+'</div>';
    });
    return h + '<div class="hint">Показаны дела на сегодня, '+DAYN[new Date(clock()).getDay()]+'. Душ появится в ср, пт и вс 🚿</div>';
  },
  look: function(){
    var L = S.look, h = '<div class="card sim"><div class="simfig">'+simSVG(L, 'great', 150)+'</div><div class="mood">'+(S.sim ? esc(S.sim) : 'Твой Сим')+' примеряет 👀</div></div><div class="card">';
    Object.keys(LOOK_OPTS).forEach(function(key){
      var o = LOOK_OPTS[key];
      h += '<div class="ftitle" style="color:var(--mut)">'+o.n+'</div><div class="sw">';
      if (o.c) o.c.forEach(function(c){ h += '<button class="dot '+(L[key] === c ? 'on' : '')+'" data-lk="'+key+'|'+c+'" style="background:'+c+'"></button>'; });
      else o.o.forEach(function(v){
        if (key === 'hat' && v[0] === 'crown' && !S.fullPyr) h += '<button class="opt" data-lk="hat|crown" style="opacity:.55">Корона 🔒</button>';
        else h += '<button class="opt '+(L[key] === v[0] ? 'on' : '')+'" data-lk="'+key+'|'+v[0]+'">'+v[1]+'</button>'; });
      h += '</div>';
    });
    return h + '<div class="log" style="margin-top:12px">Всё это бесплатно. 👑 Корону нельзя купить — только заслужить: зажги всю пирамиду. Платья и питомцы появятся в магазине 🛍️</div><button class="btn" data-act="lookdone" style="width:100%;margin-top:12px">Готово ✨</button></div>';
  },
  shop: function(){
    var h = '<div class="card"><h2>🎁 Магазин наград</h2><div class="grid">';
    S.rewards.forEach(function(r){
      var p = S.buys.filter(function(b){ return b.rid === r.id && b.status === 'pending'; }).length;
      h += '<div class="rw"><div class="e">'+r.e+'</div><div class="n">'+esc(r.title)+'</div><div class="p">'+r.price+' 🪙</div>'
        + (p ? '<span class="st p">⏳ ждёт родителя</span>' : '<button class="btn" data-buy="'+r.id+'" '+(S.points < r.price ? 'disabled' : '')+'>Купить</button>') + '</div>';
    });
    h += '</div></div>';
    var got = S.buys.filter(function(b){ return b.status === 'given'; }).slice(-5).reverse();
    if (got.length) h += '<div class="card"><h2>Полученные награды</h2>' + got.map(function(b){ return '<div class="log">✅ '+esc(b.title)+'</div>'; }).join('') + '</div>';
    return h;
  },
  check: function(){
    var h = '<div class="card"><h2>🔔 Ждут проверки</h2><div class="log">Так будут выглядеть сообщения от бота в Telegram:</div>';
    var pt = Object.keys(S.pending).map(task).filter(Boolean);
    var pb = S.buys.filter(function(b){ return b.status === 'pending'; });
    if (!pt.length && !pb.length) h += '<div class="empty">Пока ничего. Переключись на «'+esc(S.kid)+'» и нажми «Сделано» 🙂</div>';
    pt.forEach(function(t){
      h += '<div class="tg"><div class="h">Бот «СреDA»</div><div class="b">'+esc(S.kid)+': <b>'+esc(t.title)+'</b><br><small>'+reward(t)+'</small>'
        + '<div class="k"><button class="btn g" data-ok="'+t.id+'">✅ Подтвердить</button><button class="btn r" data-no="'+t.id+'">↩ Вернуть</button></div></div></div>';
    });
    pb.forEach(function(b){
      h += '<div class="tg"><div class="h">Бот «СреDA»</div><div class="b">'+esc(S.kid)+' покупает награду: <b>'+esc(b.title)+'</b> за '+b.price+' 🪙'
        + '<div class="k"><button class="btn g" data-give="'+b.id+'">🎁 Выдать</button><button class="btn r" data-deny="'+b.id+'">✖ Не сейчас</button></div></div></div>';
    });
    h += '</div><div class="card"><h2>⚡ Попросить '+esc(S.kid)+'</h2><div class="row">'
      + S.tasks.filter(function(t){ return t.freq === 'request' && t.on; }).map(function(t){
          return t.requested ? '<span class="st p">⏳ '+esc(t.title)+'</span>' : '<button class="btn s" data-req="'+t.id+'">'+esc(t.title)+' · '+t.pts+' 🪙</button>'; }).join('')
      + '</div><div class="row" style="margin-top:10px"><input id="et" placeholder="Своё поручение: полей цветы"><input id="ep" type="number" value="15" style="max-width:70px"><button class="btn" data-act="errand">Дать</button></div></div>';
    h += '<div class="card"><h2>📜 История</h2>' + (S.log.length ? S.log.slice(0,15).map(function(l){ return '<div class="log">'+esc(l)+'</div>'; }).join('') : '<div class="empty">Пусто</div>') + '</div>';
    return h;
  },
  setup: function(){
    var on = S.tasks.filter(function(t){ return t.on && !t.oneoff && ['request','free'].indexOf(t.freq) < 0 && t.pts > 0; }).length;
    var h = '<div class="card"><h2>📋 Дела в игре <small>обязательных: '+on+'</small></h2><div class="log">Вводите новые дела волнами: по 1–2 в неделю. Обязательных лучше не больше 8–10.</div>';
    FLOORS.forEach(function(f){
      h += '<div class="ftitle" style="color:'+f.c+'">'+f.e+' '+f.n+'</div>';
      S.tasks.filter(function(t){ return meta(t.need).f === f.id && !t.oneoff; }).forEach(function(t){
        h += '<div class="task"><div class="t">'+esc(t.title)+'<small>'+freqText(t)+' · '+reward(t)+'</small></div><button class="tgl '+(t.on?'on':'')+'" data-tgl="'+t.id+'">'+(t.on?'в игре':'в запасе')+'</button></div>';
      });
    });
    h += '</div>';
    var opts = NEEDS.map(function(n){ return '<option value="'+n.id+'">'+n.e+' '+n.n+'</option>'; }).join('');
    h += '<div class="card"><h2>➕ Новое дело</h2><div class="row"><input id="tt" placeholder="Например: Полила цветы"></div><div class="row" style="margin-top:8px"><select id="tn">'+opts+'</select><input id="tp" type="number" value="10" style="max-width:70px"><button class="btn" data-act="task">Добавить</button></div><div class="log">Добавляется как «каждый день». Для Семьи и Творчества баллы не начисляются.</div></div>'
      + '<div class="card"><h2>🎁 Новая награда</h2><div class="row"><input id="re" value="🎁" style="max-width:56px"><input id="rt" placeholder="Например: Кино в выходные"></div><div class="row" style="margin-top:8px"><input id="rp" type="number" value="100"><button class="btn" data-act="reward">Добавить</button></div></div>'
      + '<div class="card"><h2>🔒 PIN родителя</h2><div class="log">Кабинет родителя открывается только по PIN. Хранится только на этом телефоне.</div><button class="btn s" data-act="pin" style="margin-top:8px">Сменить PIN</button></div>'
      + '<div class="card"><h2>💾 Сохранить прогресс</h2><div class="log">Баллы, значки, Сим, дела и награды — в один файл. Пригодится при смене телефона и при переезде СреDA на сервер. PIN в файл не попадает.</div><div class="row" style="margin-top:8px"><button class="btn" data-act="export">Сохранить в файл</button><button class="btn s" data-act="import">Загрузить из файла</button></div><input type="file" id="impf" accept=".json,application/json" style="display:none"><p class="log" style="margin-top:8px">'+(S.lastBackup ? 'Последняя копия: '+new Date(S.lastBackup).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : 'Копий ещё не было')+'</p></div>'
      + '<div class="card"><h2>👧 Имя ребёнка</h2><div class="row"><input id="kidname" value="'+esc(S.kid)+'"><button class="btn" data-act="name">Сохранить</button></div></div>'
      + '<div class="card demo"><h2>🧪 Режим теста</h2><p>«Перемотай» время: шкалы убывают, дела меняются по дням недели. Ночью (21:00–07:00) шкалы на паузе, «Безопасность» на паузе в выходные.</p><div class="row"><button class="btn s" data-act="h1">+1 час</button><button class="btn s" data-act="h3">+3 часа</button><button class="btn s" data-act="d1">+1 день</button><button class="btn r" data-act="reset">Сбросить всё</button></div><p style="margin-top:10px">Время в прототипе: '+new Date(clock()).toLocaleString('ru-RU',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+'</p></div>';
    return h;
  }
};

var NOPTS = ['family','art'];
document.addEventListener('click', function(e){
  var b = e.target.closest('button,[data-floor]'); if (!b) return;
  var d = b.dataset, t, r, x;
  if (d.floor){ role = 'kid'; tab.kid = 'tasks'; render(); return; }
  if (d.role){ if (d.role === 'parent' && role !== 'parent' && !askPin()) return; role = d.role; }
  else if (d.tab){ tab[role] = d.tab; }
  else if (d.lk){ x = d.lk.split('|'); if (d.lk === 'hat|crown' && !S.fullPyr) return toast('👑 Корона — за всю пирамиду. Зажги все этажи!'); S.look[x[0]] = x[1]; }
  else if (d.ci){ x = d.ci.split(':'); var c = S.checks[x[0]]; c.v[+x[1]] = !c.v[+x[1]]; }
  else if (d.done){ t = task(d.done); if (stateOf(t).s !== 'open') return;
    if (t.check){ var cc = S.checks[t.id]; if (!cc || cc.day !== dayKey(clock()) || !cc.v.every(Boolean)) return toast('Сначала отметь всё в списке ☑'); }
    if (t.auto){ var m = confirmTask(t); log('🔔 Родителям: '+S.kid+' — '+t.title); toast('🔔 Мама и папа получили: «'+t.title+'» · '+m); }
    else { S.pending[t.id] = 1; delete S.notes[t.id]; log(S.kid+' отметила: '+t.title); toast('Отправлено родителю на проверку ⏳'); } }
  else if (d.ok){ t = task(d.ok); toast(confirmTask(t)); log('Подтверждено: '+t.title); }
  else if (d.no){ t = task(d.no); x = prompt('Комментарий для ребёнка (можно пусто):', ''); if (x === null) return;
    delete S.pending[t.id]; S.notes[t.id] = x || 'проверь ещё раз'; log('Возвращено: '+t.title); toast('Дело вернулось ↩'); }
  else if (d.req){ t = task(d.req); t.requested = true; log('⚡ Просьба: '+t.title); toast('⚡ '+S.kid+' получила просьбу'); }
  else if (d.tgl){ t = task(d.tgl); t.on = !t.on; if (t.on && S.needs[t.need] && !needOn_before(t)) S.needs[t.need] = {v:50, t:clock()}; toast(t.on ? 'Дело в игре: '+t.title : 'Дело в запасе'); }
  else if (d.buy){ r = S.rewards.filter(function(x){ return x.id === d.buy; })[0]; if (S.points < r.price) return;
    S.buys.push({id:'b'+Date.now(), rid:r.id, title:r.e+' '+r.title, price:r.price, status:'pending'}); log(S.kid+' хочет: '+r.title); toast('Запрос родителю отправлен 🎁'); }
  else if (d.give){ x = S.buys.filter(function(y){ return y.id === d.give; })[0]; if (S.points < x.price){ toast('Не хватает баллов'); return; }
    S.points -= x.price; x.status = 'given'; log('Выдана награда: '+x.title+' (−'+x.price+')'); toast('Награда выдана 🎉'); pop(); }
  else if (d.deny){ x = S.buys.filter(function(y){ return y.id === d.deny; })[0]; x.status = 'denied'; log('Отложена награда: '+x.title); }
  else if (d.act){
    if (d.act === 'look'){ tab.kid = 'look'; }
    if (d.act === 'lookdone'){ tab.kid = 'sim'; toast('Красота! ✨'); }
    if (d.act === 'simname'){ x = prompt('Как зовут твоего Сима?', S.sim || ''); if (x === null) return; x = x.trim().slice(0, 20); S.sim = x; if (x){ log(S.kid+' назвала Сима: '+x); toast('Привет, я '+x+'! 💚'); } }
    if (d.act === 'pin'){ if (setPin()) toast('Новый PIN сохранён 🔒'); }
    if (d.act === 'name'){ x = document.getElementById('kidname').value.trim(); if (x) S.kid = x; toast('Сохранено'); }
    if (d.act === 'errand'){ x = document.getElementById('et').value.trim(); if (!x) return toast('Напиши, о чём попросить');
      S.tasks.push({id:'e'+Date.now(), need:'help', title:x, pts:+document.getElementById('ep').value || 15, gain:40, freq:'request', requested:true, oneoff:true, on:true});
      log('⚡ Поручение: '+x); toast('⚡ '+S.kid+' получила поручение'); }
    if (d.act === 'task'){ x = document.getElementById('tt').value.trim(); if (!x) return toast('Напиши название дела');
      var nid = document.getElementById('tn').value, p = NOPTS.indexOf(nid) >= 0 ? 0 : (+document.getElementById('tp').value || 10);
      S.tasks.push({id:'t'+Date.now(), need:nid, title:x, pts:p, gain:nid === 'art' ? 0 : 40, freq:nid === 'art' ? 'free' : 'daily', on:true}); toast('Дело добавлено'); }
    if (d.act === 'reward'){ x = document.getElementById('rt').value.trim(); if (!x) return toast('Напиши название награды');
      S.rewards.push({id:'r'+Date.now(), e:document.getElementById('re').value.trim() || '🎁', title:x, price:+document.getElementById('rp').value || 100}); toast('Награда добавлена'); }
    if (d.act === 'export'){ exportState(); }
    if (d.act === 'import'){ document.getElementById('impf').click(); return; }
    if (d.act === 'h1') S.offset += 3600000;
    if (d.act === 'h3') S.offset += 3*3600000;
    if (d.act === 'd1') S.offset += 86400000;
    if (d.act === 'reset'){ if (!confirm('Сбросить все баллы, дела и награды?')) return; S = null; S = fresh(); }
  }
  save(); render();
});
// новая шкала стартует с 50%, а не с нуля, если до этого её дел не было в игре
function needOn_before(t){ return S.tasks.some(function(x){ return x !== t && x.need === t.need && x.on && x.freq !== 'request'; }); }
// PIN кабинета родителя: задаётся при первом входе, хранится только в этом браузере
function setPin(){
  var a = prompt('Придумайте PIN для кабинета родителя (4 цифры):'); if (a === null) return false;
  if (!/^\d{4}$/.test(a)){ toast('Нужно ровно 4 цифры'); return false; }
  if (prompt('Повторите PIN:') !== a){ toast('PIN не совпал'); return false; }
  S.pin = a; save(); return true;
}
function askPin(){
  if (!S.pin){ if (!setPin()) return false; toast('PIN сохранён 🔒'); return true; }
  var x = prompt('PIN родителя:'); if (x === null) return false;
  if (x !== S.pin){ toast('Неверный PIN 🔒'); return false; }
  return true;
}
// Резервная копия: файл .json без PIN; загрузка заменяет прогресс, PIN этого телефона остаётся
function exportState(){
  S.lastBackup = Date.now();
  var data = JSON.parse(JSON.stringify(S)); delete data.pin;
  var txt = JSON.stringify({app:'sreda', ver:3, saved:new Date().toISOString(), data:data}, null, 1);
  var d = new Date(), name = 'sreda-'+S.kid+'-'+d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)+'.json';
  try{
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], {type:'application/json'})); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); toast('Файл сохранён в «Загрузки» 💾'); log('Сохранена копия прогресса');
  }catch(e){ toast('Не получилось сохранить файл'); }
}
function importState(txt){
  var x; try{ x = JSON.parse(txt); }catch(e){ return toast('Это не файл СреDA'); }
  if (!x || x.app !== 'sreda' || !x.data || !Array.isArray(x.data.tasks) || !x.data.needs) return toast('Это не файл СреDA');
  if (!confirm('Заменить текущий прогресс копией от '+new Date(x.saved).toLocaleString('ru-RU')+'?')) return;
  var pin = S.pin; S = x.data; if (pin) S.pin = pin; else delete S.pin;
  if (!S.look) S.look = JSON.parse(JSON.stringify(LOOK_DEF));
  Object.keys(LOOK_DEF).forEach(function(k){ if (!S.look[k]) S.look[k] = LOOK_DEF[k]; });
  log('Прогресс загружен из файла'); save(); render(); toast('Прогресс загружен ✅');
}
document.addEventListener('change', function(e){
  if (e.target.id !== 'impf' || !e.target.files[0]) return;
  var f = e.target.files[0], rd = new FileReader();
  rd.onload = function(){ importState(rd.result); }; rd.readAsText(f); e.target.value = '';
});
function pop(){ setTimeout(function(){ var el = document.getElementById('pts'); el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }, 0); }

S = load() || fresh();
if (!S.look) S.look = JSON.parse(JSON.stringify(LOOK_DEF));
Object.keys(LOOK_DEF).forEach(function(k){ if (!S.look[k]) S.look[k] = LOOK_DEF[k]; });
render();
setInterval(function(){ if (tab[role] === 'sim' || tab[role] === 'tasks') render(); }, 30000);
</script>
</body>
